name: Bug report
description: Something in Nightshade Player doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! One problem per report, please.
        **Never attach or link games, the RTP or keys.** Reports that do are closed.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: When I talk to an NPC in Toy Story 2, a gray box covers the screen instead of the text.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from starting Nightshade Player. Does it happen every time?
      placeholder: |
        1. Start Toy Story 2
        2. Walk up to Mr. Potato Head and press X
        3. A gray box appears (every time)
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      description: "Only if it's about a game. Its title, and RPG Maker 2000 or 2003 (under its title in the library)."
      placeholder: My Game (RPG Maker 2000)

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - A game looks wrong (graphics)
        - A game sounds wrong
        - A game crashes, freezes or won't start
        - Nightshade Player crashes or closes
        - The PS5 crashes or freezes
        - Storage / "can't open /data/Nightshade Player"
        - Controls or button mapping
        - Menus, shelf or settings
        - Covers, cheats or memory cards
        - RetroAchievements
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nightshade Player version
      description: Settings → About → Version
      placeholder: 1.2.0
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: PS5 and jailbreak
      description: Model, firmware, and what you load (and in what order).
      placeholder: PS5 slim, 13.60, etaHEN 2.x + kstuff, ShadowMountPlus
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings that might matter
      description: Anything you changed, especially the shader, upscaling and fast-forward. Does it still happen with the default settings?
      placeholder: CRT Royale on. With the shader off it doesn't happen.

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach `/data/nightshade-player/logs/nightshade-player.log`. Copy it with FTP **right after** the problem,
        before starting Nightshade Player again (each start replaces it). After a crash it ends with a
        `crash:` section; that's the most useful part.
      placeholder: Drag the Nightshade Player.log file here.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshot or video
      description: A photo of the screen helps a lot for graphics problems.

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
        - label: My game is my own dump, and I'm not sharing games, the RTP or keys.
          required: true
