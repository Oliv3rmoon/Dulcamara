name: Game compatibility
description: Tell us how a game runs (works fine, has issues, or doesn't start)
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game, and RPG Maker 2000 or 2003
      placeholder: My Game (RPG Maker 2003)
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How does it run?
      options:
        - Playable (no problems that get in the way)
        - Issues (graphics, sound, slowdowns, a crash somewhere)
        - Crashes (early, can't really be played)
        - Won't start
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How far you played, what goes wrong, settings that help, and whether it runs on EasyRPG Player on a PC.
  - type: input
    id: version
    attributes:
      label: Nightshade Player version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: rtp
    attributes:
      label: RTP
      options:
        - The game carries everything (no RTP)
        - The RPG Maker RTP in rtp/2000 or rtp/2003
        - The EasyRPG RTP replacement
