# SwanStationPS5 - cloud build: the PS5 app and the disc daemon payload.
# Nightshade Station (Oliv3rmoon/Nightshade-Station): a version tag (X.Y.Z, the SwanStationPS5_VERSION of
# src/SwanStationPS5.h) pushed to that repository also publishes: job "release" puts the PPSA98510.zip,
# SwanStationPS5-DiscDaemon.elf and SHA256SUMS this run built on a GitHub release, the latest, which the
# app's update check (src/update_release.h) and Nightshade's Settings > Apps then offer. Nothing built
# anywhere else is ever attached, and a release that already has a ZIP is never changed.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Download the results from the run's page, under Artifacts:
#   PPSA98510                    PPSA98510.zip, the same zip the releases carry
#   SwanStationPS5-DiscDaemon    SwanStationPS5-DiscDaemon.elf, the payload to send to the console's ELF loader
#                                (port 9021); see payload/discd.c
#   release                      both, with SHA256SUMS: what a release publishes

name: Build Nightshade Station

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps5:
    name: PS5 app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      TITLE_ID: PPSA98510
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # A release's tag is the app's version: 1.6.0 is SwanStationPS5_VERSION "1.6.0" and contentVersion 01.006.000.
      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          version = re.search(r'#define\s+SwanStationPS5_VERSION\s+"([^"]+)"', open("src/SwanStationPS5.h").read()).group(1)
          content = json.load(open("sce_sys/param.json"))["contentVersion"]
          parts = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          want = "%02d.%03d.%03d" % tuple(int(p) for p in parts.groups()) if parts else None
          if tag != version or content != want:
              raise SystemExit(f"tag {tag}, SwanStationPS5_VERSION {version}, contentVersion {content}: they must agree")
          print(f"{tag}: SwanStationPS5_VERSION {version}, contentVersion {content}")
          PY

      # SwanStation is the PS5 emulator.
      - name: Fetch submodules
        run: |
          git submodule update --init --recursive --depth=1 third_party/rcheevos
          git submodule update --init --depth=1 third_party/swanstation

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 libclang-rt-18-dev make ninja-build ccache \
            pkg-config tar unzip wget python3 python3-venv zstd

      # The update's release decision and SHA-256, under the sanitizers (tests/test_update_release.py).
      - name: Host checks
        env:
          CC: clang-18
        run: python3 -m unittest tests.test_update_release -v

      - name: Restore downloaded SDK and libraries
        uses: actions/cache@v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
            .deps/lapy
          key: deps-${{ runner.os }}-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py') }}

      # The payload first: it takes seconds, and if it fails nobody waits for the app to build to find out.
      - name: Build the disc daemon payload
        run: make disc-daemon

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make

      - name: Check system module imports
        run: python3 tools/check-imports.py dist/PPSA98510/eboot.bin

      # The same PPSA98510.zip that tools/make_release.py packs for a release.
      - name: Pack PPSA98510.zip
        run: python3 tools/make_release.py --skip-build

      # What the update and Nightshade's Settings > Apps unpack: the app folder, this title at this version.
      - name: Check PPSA98510.zip
        run: |
          python3 - PPSA98510.zip "$TITLE_ID" <<'PY'
          import json, re, sys, zipfile
          path, title = sys.argv[1:3]
          version = re.search(r'#define\s+SwanStationPS5_VERSION\s+"([^"]+)"', open("src/SwanStationPS5.h").read()).group(1)
          content = "%02d.%03d.%03d" % tuple(int(p) for p in version.split("."))
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if not names or archive.testzip() is not None:
                  raise SystemExit("ZIP check failed: empty or damaged")
              outside = sorted(n for n in names if not n.startswith(title + "/"))
              if outside:
                  raise SystemExit(f"ZIP check failed: entries outside {title}/: {outside[:5]}")
              for needed in ("eboot.bin", "sce_sys/param.json", "sce_sys/icon0.png", "sce_sys/pic0.dds", "sce_sys/pic1.dds"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              param = json.loads(archive.read(f"{title}/sce_sys/param.json"))
              name = param["localizedParameters"]["en-US"]["titleName"]
              if param["titleId"] != title or param["contentVersion"] != content or name != "Nightshade Station":
                  raise SystemExit(f"ZIP check failed: param.json is {param['titleId']} {param['contentVersion']} {name!r}")
              print(f"{len(names)} entries; {title} {content} {name!r}")
          PY

      - name: Write SHA256SUMS
        run: |
          mkdir -p release
          cp PPSA98510.zip dist/SwanStationPS5-DiscDaemon.elf release/
          (cd release && sha256sum PPSA98510.zip SwanStationPS5-DiscDaemon.elf > SHA256SUMS && cat SHA256SUMS)

      # Signed provenance: these files were built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R Oliv3rmoon/Nightshade-Station`. Not for pull
      # requests (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release files
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/PPSA98510.zip
            release/SwanStationPS5-DiscDaemon.elf

      - name: Upload PPSA98510.zip
        uses: actions/upload-artifact@v4
        with:
          name: PPSA98510
          path: PPSA98510.zip
          if-no-files-found: error

      - name: Upload the disc daemon payload
        uses: actions/upload-artifact@v4
        with:
          name: SwanStationPS5-DiscDaemon
          path: dist/SwanStationPS5-DiscDaemon.elf
          if-no-files-found: error

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/PPSA98510.zip
            release/SwanStationPS5-DiscDaemon.elf
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: ps5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Download the files this run built
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Check the download
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 3 )) || [[ ! -f PPSA98510.zip || ! -f SwanStationPS5-DiscDaemon.elf || ! -f SHA256SUMS ]]; then
            echo "Expected exactly PPSA98510.zip, SwanStationPS5-DiscDaemon.elf and SHA256SUMS in the artifact." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          assets=(release/PPSA98510.zip release/SwanStationPS5-DiscDaemon.elf release/SHA256SUMS)
          notes="docs/releases/$TAG.md"
          # The files of a release come from the run of its tag, once. A release without a ZIP (notes
          # written in advance, or a draft) gets them and keeps its title and notes; one that already has
          # a ZIP is never touched, because players may have checked that ZIP against its SHA256SUMS.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qx 'PPSA98510.zip' <<< "$names"; then
              echo "::warning title=Release files not from this run::The release $TAG already has PPSA98510.zip; it was not replaced."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ -f $notes ]]; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Nightshade Station $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Nightshade Station $TAG" --generate-notes
          fi
