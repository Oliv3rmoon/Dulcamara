# Dulcamara - cloud build of the PS5 app, with the host checks (Mandrake's workflow).
# A version tag (X.Y.Z, the NP_VERSION of src/nightshade.h) pushed to Oliv3rmoon/Dulcamara also publishes:
# job "release" puts the PPSA99010.zip and SHA256SUMS this run built on a GitHub release, the latest, which the
# app's update check (src/update_release.h) and Nightshade's Settings > Apps then offer. Nothing built anywhere
# else is ever attached, and a release that already has a ZIP is never changed.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Download the results from the run's page, under Artifacts:
#   PPSA99010    PPSA99010.zip, the same zip the releases carry
#   release      it and SHA256SUMS: what a release publishes

name: Build Dulcamara

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps5:
    name: PS5 app
    runs-on: ubuntu-24.04
    # Ren'Py's core takes about half an hour when its caches are cold
    timeout-minutes: 120
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      TITLE_ID: PPSA99010
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # A release's tag is the app's version: 0.1.0 is NP_VERSION "0.1.0" and contentVersion 00.001.000.
      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          version = re.search(r'#define\s+NP_VERSION\s+"([^"]+)"', open("src/nightshade.h").read()).group(1)
          content = json.load(open("sce_sys/param.json"))["contentVersion"]
          parts = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          want = "%02d.%03d.%03d" % tuple(int(p) for p in parts.groups()) if parts else None
          if tag != version or content != want:
              raise SystemExit(f"tag {tag}, NP_VERSION {version}, contentVersion {content}: they must agree")
          print(f"{tag}: NP_VERSION {version}, contentVersion {content}")
          PY

      # EasyRPG Player (with libretro-common inside it), liblcf and inih, Ren'Py 8 and 7 and pygame_sdl2: the cores and
      # what they are built from. Only EasyRPG Player's own submodule is fetched within: pygame_sdl2 records a Windows
      # one (pygame_sdl2_windeps) that its .gitmodules does not name.
      - name: Fetch submodules
        run: |
          git submodule update --init --depth=1
          git -C third_party/easyrpg-player submodule update --init --recursive --depth=1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 libclang-rt-18-dev make ninja-build ccache cmake \
            pkg-config tar unzip wget zip python3 python3-venv zstd \
            libfmt-dev libpng-dev zlib1g-dev libfreetype-dev libharfbuzz-dev libvorbis-dev libmpg123-dev \
            libpixman-1-dev libssl-dev libbz2-dev liblzma-dev nasm patch \
            libsdl2-dev libsdl2-image-dev libfribidi-dev libjpeg-dev libwebp-dev libegl-dev libegl-mesa0 libgl1-mesa-dri \
            libffi-dev

      - name: Restore downloaded SDK, libraries and test games
        uses: actions/cache@v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
            .deps/lapy
            .deps/pixman
            .deps/testgame
          key: deps-${{ runner.os }}-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py', 'tools/fetch-radv.sh', 'tools/fetch-testgame.sh', 'tools/build-easyrpg.sh') }}

      # The core for the PS5 is rebuilt only when its sources, its patch or its build script change: its build
      # stamp (build/easyrpg-ps5/.stamp) says which it was built from.
      - name: Note the core's sources
        run: |
          git submodule status > build-core-sources.txt
          git -C third_party/easyrpg-player submodule status --recursive >> build-core-sources.txt
      - name: Restore the PS5 core
        uses: actions/cache@v4
        with:
          path: build/easyrpg-ps5
          key: easyrpg-ps5-${{ hashFiles('build-core-sources.txt', 'tools/build-easyrpg.sh', 'tools/patches/*', 'tooling/prospero-clang18') }}

      # Ren'Py's two cores for the PS5 and what they start from on the build machine (tools/build-renpy.sh ps5,
      # tools/build-renpy7.sh ps5): each stage is rebuilt only when what it is built from changed.
      - name: Restore Ren'Py's cores
        uses: actions/cache@v4
        with:
          path: |
            .deps/renpy
            build/renpy-host
            build/renpy-ps5
            build/renpy7-host
            build/renpy7-ps5
          key: renpy-ps5-${{ hashFiles('build-core-sources.txt', 'tools/build-renpy*.sh', 'tools/renpy/*', 'tools/renpy7/*', 'tools/patches/*', 'tooling/ps5-stubs/*', 'src/core/renpy/*') }}
          restore-keys: renpy-ps5-

      # On the build machine: the update's release decision, the library's game detection, EasyRPG Player's core
      # (the same revisions and patch as the PS5's) run headless on EasyRPG's TestGame, and Ren'Py's two cores (the
      # same Ren'Py, CPython, FFmpeg and Assimp as the PS5's) on tests/renpy-game, drawing through Mesa's EGL without
      # a screen. Each Ren'Py host build is also where its PS5 build starts (its Python, its generated C, its engine).
      - name: Host checks
        env:
          CC: clang-18
          CXX: clang++-18
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python3 -m unittest tests.test_update_release tests.test_library tests.test_core tests.test_renpy_core
          tests.test_renpy7_core -v

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make

      - name: Check system module imports
        run: python3 tools/check-imports.py dist/PPSA99010/eboot.bin

      # The same PPSA99010.zip that tools/make_release.py packs for a release.
      - name: Pack PPSA99010.zip
        run: python3 tools/make_release.py --skip-build

      # What the update and Nightshade's Settings > Apps unpack: the app folder, this title at this version.
      - name: Check PPSA99010.zip
        run: |
          python3 - PPSA99010.zip "$TITLE_ID" <<'PY'
          import json, re, sys, zipfile
          path, title = sys.argv[1:3]
          version = re.search(r'#define\s+NP_VERSION\s+"([^"]+)"', open("src/nightshade.h").read()).group(1)
          content = "%02d.%03d.%03d" % tuple(int(p) for p in version.split("."))
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if not names or archive.testzip() is not None:
                  raise SystemExit("ZIP check failed: empty or damaged")
              outside = sorted(n for n in names if not n.startswith(title + "/"))
              if outside:
                  raise SystemExit(f"ZIP check failed: entries outside {title}/: {outside[:5]}")
              for needed in ("eboot.bin", "sce_sys/param.json", "sce_sys/icon0.png", "sce_sys/pic0.dds",
                             "sce_sys/pic1.dds", "licenses/LICENSE-EasyRPG-Player.txt", "licenses/LICENSE-liblcf.txt",
                             "licenses/LICENSE-pixman.txt", "licenses/LICENSE-inih.txt", "licenses/THIRD-PARTY.txt",
                             "licenses/LICENSE-RenPy.rst", "licenses/LICENSE-Python.txt", "licenses/LICENSE-FFmpeg.txt",
                             "licenses/LICENSE-Assimp.txt", "licenses/LICENSE-ps5-opengl.txt",
                             "assets/renpy8/renpy/__init__.py", "assets/renpy8/lib/python312.zip",
                             "assets/renpy8/dulcamara_boot.py", "licenses/LICENSE-RenPy7.rst",
                             "licenses/LICENSE-Python2.txt", "licenses/LICENSE-pygame_sdl2.txt",
                             "licenses/LICENSE-pygame_sdl2-LGPL.txt",
                             "assets/renpy7/renpy/__init__.py", "assets/renpy7/lib/python27.zip",
                             "assets/renpy7/dulcamara_boot.py"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              # no game files of any kind: players copy their own (Ren'Py's own scripts are its engine's)
              games = sorted(n for n in names if re.search(r"(?i)rpg_rt\.(ldb|lmt|ini)$|\.(lmu|lsd|easyrpg|rpa)$", n)
                             or (re.search(r"(?i)\.rpyc?$", n)
                                 and not n.startswith((f"{title}/assets/renpy8/renpy/", f"{title}/assets/renpy7/renpy/"))))
              if games:
                  raise SystemExit(f"ZIP check failed: game files in the package: {games[:5]}")
              param = json.loads(archive.read(f"{title}/sce_sys/param.json"))
              name = param["localizedParameters"]["en-US"]["titleName"]
              if param["titleId"] != title or param["contentVersion"] != content or name != "Dulcamara":
                  raise SystemExit(f"ZIP check failed: param.json is {param['titleId']} {param['contentVersion']} {name!r}")
              print(f"{len(names)} entries; {title} {content} {name!r}")
          PY

      - name: Write SHA256SUMS
        run: |
          mkdir -p release
          cp PPSA99010.zip release/
          (cd release && sha256sum PPSA99010.zip > SHA256SUMS && cat SHA256SUMS)

      # Signed provenance: this file was built by this workflow from this commit. Anyone can check a downloaded
      # copy with `gh attestation verify PPSA99010.zip -R Oliv3rmoon/Dulcamara`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release files
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/PPSA99010.zip

      - name: Upload PPSA99010.zip
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99010
          path: PPSA99010.zip
          if-no-files-found: error

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/PPSA99010.zip
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: ps5
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Download the files this run built
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Check the download
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          if (( ${#files[@]} != 2 )) || [[ ! -f PPSA99010.zip || ! -f SHA256SUMS ]]; then
            echo "Expected exactly PPSA99010.zip and SHA256SUMS in the artifact." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          assets=(release/PPSA99010.zip release/SHA256SUMS)
          notes="docs/releases/$TAG.md"
          # The files of a release come from the run of its tag, once. A release without a ZIP (notes
          # written in advance, or a draft) gets them and keeps its title and notes; one that already has
          # a ZIP is never touched, because players may have checked that ZIP against its SHA256SUMS.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qx 'PPSA99010.zip' <<< "$names"; then
              echo "::warning title=Release files not from this run::The release $TAG already has PPSA99010.zip; it was not replaced."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ -f $notes ]]; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Dulcamara $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Dulcamara $TAG" --generate-notes
          fi
